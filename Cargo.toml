[package]
name = "torrentmanager"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
clap = { version = "4.5", features = [ "derive" ] }
chrono = "0.4"
rocket = "0.5"
rocket_dyn_templates = { version = "0.1", features = [ "tera" ] }
toml = "0.8"
serde = { version = "1", features = [ "derive" ] }
snafu = "0.8"
hightorrent = { path = "../hightorrent" }
hightorrent_api = { path = "../hightorrent_api" }
hightorrent_api_qbittorrent = { path = "../hightorrent_api_qbittorrent" }

# To save uploaded magnet/torrent to temporary file
temp-file = "0.1"
# To base64url encode tags
base64-url = "2"

# Logging
log = "0.4"
pretty_env_logger = "0.5"
# env_logger = "0.11"

# Convert to human-readable sizes
human_bytes = "0.4.3"

# Async IO
tokio = { version = "1", features = [ "fs" ] }

# Graceful shutdown
signal-hook = "0.3"
dirs = "6.0.0"

[profile.release]
strip = true
#lto = "thin"
#opt-level = "z"

[lib]
name = "torrentmanager"
path = "src/lib.rs"

[[bin]]
name = "torrentmanager"
path = "src/main.rs"

